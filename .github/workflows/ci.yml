# Esteira principal: qualidade → testes de ponta a ponta → deploy.
# - Em pull request: roda tudo e publica uma versão de prévia com link no PR.
# - Na main: roda tudo e, se passar, aplica migrações do banco e publica em produção.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uma execução por branch; um push novo cancela a anterior (menos na main, para não interromper deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  qualidade:
    name: Tipos, lint, formatação e testes de unidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Pipeline de dados compila
        run: python3 -m py_compile data/pipeline/build.py
      - run: pnpm build

  e2e:
    name: Ponta a ponta (desktop e celular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  previa:
    name: Prévia do PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [qualidade, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Envia uma versão de prévia (não muda a produção)
        id: upload
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Comenta o link da prévia
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url=$(printf '%s' "$OUTPUT" | grep -oE 'https://pr-[^ ]+workers\.dev' | head -1)
          [ -n "$url" ] && gh pr comment "$PR" --edit-last --create-if-none --body "Prévia deste PR: $url"

  producao:
    name: Deploy em produção
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qualidade, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: producao
      url: https://proxinho.johnlaff.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Migrações do banco e deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: pnpm exec wrangler d1 migrations apply proxinho --remote
          command: deploy
      - name: Teste de fumaça em produção
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://proxinho.johnlaff.com/api/health && exit 0
            sleep 5
          done
          exit 1
