# Atualizações automáticas e agrupadas, uma vez por semana.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      app:
        dependency-type: production
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    ignore:
      # os tipos do Node acompanham a versão que roda no CI e na Cloudflare (24);
      # sobe junto com NODE_VERSION em .github/workflows/ci.yml, não sozinho
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
